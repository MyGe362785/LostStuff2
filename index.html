<!doctype html>
<html lang="th" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23784D34'><path d='M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      try {
        const savedTheme = localStorage.getItem('foundit-theme')
        document.documentElement.dataset.theme = savedTheme === 'mono-red' || savedTheme === 'vivid' ? 'mono-red' : 'warm'
      } catch (_) {
        document.documentElement.dataset.theme = 'warm'
      }
    </script>
    <title>Foundit-KKU - ระบบแจ้งเตือนและติดตามของหายในมหาวิทยาลัย</title>
    <meta name="description" content="ระบบแจ้งเตือนและติดตามของหายในมหาวิทยาลัย (University Lost & Found Portal) พร้อมระบบจับคู่ของหายอัตโนมัติ (Automated Matching Engine)" />
  </head>
  <body class="bg-brand-paper text-brand-espresso antialiased font-sans selection:bg-brand-caramel selection:text-white min-h-screen">
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
